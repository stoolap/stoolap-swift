name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  STOOLAP_ENGINE_REF: v0.4.0

jobs:
  build-lib:
    strategy:
      fail-fast: true
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
            lib_file: libstoolap_c.dylib
          - host: macos-latest
            target: x86_64-apple-darwin
            lib_file: libstoolap_c.dylib

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone stoolap engine
        run: git clone --depth 1 --branch ${{ env.STOOLAP_ENGINE_REF }} https://github.com/stoolap/stoolap.git stoolap-engine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/stoolap-c
          key: ${{ matrix.settings.target }}

      - name: Build stoolap-c
        working-directory: crates/stoolap-c
        run: cargo build --release --target ${{ matrix.settings.target }}

      - name: Fix macOS install name
        run: install_name_tool -id @rpath/libstoolap_c.dylib crates/stoolap-c/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}

      - name: Strip shared library
        run: strip -x crates/stoolap-c/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.settings.target }}
          path: crates/stoolap-c/target/${{ matrix.settings.target }}/release/${{ matrix.settings.lib_file }}
          if-no-files-found: error

  test:
    name: Test - Swift ${{ matrix.swift }} (macOS)
    needs: build-lib
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        swift: ['5.10', '6.0', '6.1']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: lib-aarch64-apple-darwin
          path: lib

      - name: Configure library path
        run: |
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/lib" >> $GITHUB_ENV
          echo "LIBRARY_PATH=${{ github.workspace }}/lib" >> $GITHUB_ENV

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  release:
    name: Create GitHub Release
    needs: [build-lib, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download aarch64 library
        uses: actions/download-artifact@v4
        with:
          name: lib-aarch64-apple-darwin
          path: artifacts/aarch64

      - name: Download x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: lib-x86_64-apple-darwin
          path: artifacts/x86_64

      - name: Prepare release assets
        run: |
          mv artifacts/aarch64/libstoolap_c.dylib artifacts/libstoolap_c-darwin-arm64.dylib
          mv artifacts/x86_64/libstoolap_c.dylib artifacts/libstoolap_c-darwin-x64.dylib

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/libstoolap_c-darwin-arm64.dylib
            artifacts/libstoolap_c-darwin-x64.dylib
