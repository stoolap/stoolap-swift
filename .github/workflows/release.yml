name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  STOOLAP_ENGINE_REF: v0.4.1

jobs:
  build-lib:
    strategy:
      fail-fast: true
      matrix:
        settings:
          - host: macos-14
            target: aarch64-apple-darwin
          - host: macos-14
            target: x86_64-apple-darwin
          - host: macos-14
            target: aarch64-apple-ios
          - host: macos-14
            target: aarch64-apple-ios-sim
          - host: macos-14
            target: x86_64-apple-ios

    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone stoolap engine
        run: git clone --depth 1 --branch ${{ env.STOOLAP_ENGINE_REF }} https://github.com/stoolap/stoolap.git stoolap-engine

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/stoolap-c
          key: ${{ matrix.settings.target }}

      - name: Build stoolap-c
        working-directory: crates/stoolap-c
        run: cargo build --release --target ${{ matrix.settings.target }}

      - name: Strip static library
        run: strip -x crates/stoolap-c/target/${{ matrix.settings.target }}/release/libstoolap_c.a

      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.settings.target }}
          path: crates/stoolap-c/target/${{ matrix.settings.target }}/release/libstoolap_c.a
          if-no-files-found: error

      # Also upload dylib for macOS targets (used by swift build/test)
      - name: Fix macOS install name
        if: contains(matrix.settings.target, 'darwin')
        run: install_name_tool -id @rpath/libstoolap_c.dylib crates/stoolap-c/target/${{ matrix.settings.target }}/release/libstoolap_c.dylib

      - name: Strip shared library
        if: contains(matrix.settings.target, 'darwin')
        run: strip -x crates/stoolap-c/target/${{ matrix.settings.target }}/release/libstoolap_c.dylib

      - name: Upload shared library
        if: contains(matrix.settings.target, 'darwin')
        uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ matrix.settings.target }}
          path: crates/stoolap-c/target/${{ matrix.settings.target }}/release/libstoolap_c.dylib
          if-no-files-found: error

  test:
    name: Test - Swift ${{ matrix.swift }} (${{ matrix.os }})
    needs: build-lib
    strategy:
      fail-fast: true
      matrix:
        include:
          - swift: '5.10'
            os: macos-14
          - swift: '6.0'
            os: macos-14
          - swift: '6.1'
            os: macos-15

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: dylib-aarch64-apple-darwin
          path: lib

      - name: Configure library path
        run: |
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/lib" >> $GITHUB_ENV
          echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/lib" >> $GITHUB_ENV
          echo "LIBRARY_PATH=${{ github.workspace }}/lib" >> $GITHUB_ENV

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  xcframework:
    name: Build XCFramework
    needs: build-lib
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all static libraries
        uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: libs

      - name: Create fat libraries
        run: |
          mkdir -p fat/macos fat/ios-sim

          # macOS universal (arm64 + x86_64)
          lipo -create \
            libs/lib-aarch64-apple-darwin/libstoolap_c.a \
            libs/lib-x86_64-apple-darwin/libstoolap_c.a \
            -output fat/macos/libstoolap_c.a

          # iOS simulator universal (arm64 + x86_64)
          lipo -create \
            libs/lib-aarch64-apple-ios-sim/libstoolap_c.a \
            libs/lib-x86_64-apple-ios/libstoolap_c.a \
            -output fat/ios-sim/libstoolap_c.a

      - name: Assemble XCFramework
        run: |
          xcodebuild -create-xcframework \
            -library fat/macos/libstoolap_c.a \
            -headers Sources/CStoolap/include \
            -library libs/lib-aarch64-apple-ios/libstoolap_c.a \
            -headers Sources/CStoolap/include \
            -library fat/ios-sim/libstoolap_c.a \
            -headers Sources/CStoolap/include \
            -output StoolapC.xcframework

      - name: Zip XCFramework
        run: zip -r StoolapC.xcframework.zip StoolapC.xcframework

      - name: Compute checksum
        id: checksum
        run: echo "sha256=$(shasum -a 256 StoolapC.xcframework.zip | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoolapC-xcframework
          path: StoolapC.xcframework.zip
          if-no-files-found: error

    outputs:
      checksum: ${{ steps.checksum.outputs.sha256 }}

  release:
    name: Create GitHub Release
    needs: [build-lib, test, xcframework]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download aarch64 dylib
        uses: actions/download-artifact@v4
        with:
          name: dylib-aarch64-apple-darwin
          path: artifacts/aarch64

      - name: Download x86_64 dylib
        uses: actions/download-artifact@v4
        with:
          name: dylib-x86_64-apple-darwin
          path: artifacts/x86_64

      - name: Download XCFramework
        uses: actions/download-artifact@v4
        with:
          name: StoolapC-xcframework
          path: artifacts

      - name: Prepare release assets
        run: |
          mv artifacts/aarch64/libstoolap_c.dylib artifacts/libstoolap_c-darwin-arm64.dylib
          mv artifacts/x86_64/libstoolap_c.dylib artifacts/libstoolap_c-darwin-x64.dylib

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### XCFramework (iOS + macOS)

            ```
            SHA-256: ${{ needs.xcframework.outputs.checksum }}
            ```

            Platforms: macOS (arm64, x86_64), iOS (arm64), iOS Simulator (arm64, x86_64)
          files: |
            artifacts/libstoolap_c-darwin-arm64.dylib
            artifacts/libstoolap_c-darwin-x64.dylib
            artifacts/StoolapC.xcframework.zip
